name: ProLIF Web parity

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-parity.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-parity.yml"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser package
        run: npm ci --prefix web

      - name: Run browser parity and unit tests
        run: npm --prefix web test

      - name: Type-check browser package
        run: npm --prefix web run typecheck

      - name: Build browser package
        run: npm --prefix web run build

      - name: Install Python oracle environment
        uses: astral-sh/setup-uv@v7

      - name: Sync Python ProLIF test dependencies
        run: uv sync --group tests --locked

      - name: Match the browser oracle RDKit release
        run: uv pip install --python .venv/bin/python rdkit==2025.3.6

      - name: Regenerate Python oracle
        run: >-
          uv run --no-sync python web/parity/generate_reference.py
          --output /tmp/prolif-2.2.1-core.json

      - name: Require committed oracle to be current
        run: diff -u web/tests/reference/prolif-2.2.1-core.json /tmp/prolif-2.2.1-core.json
